name: Report a bug
description: Something in Mission Control doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The steps that lead to the bug, if you know them.
      placeholder: |
        1. Pasted the link ...
        2. Clicked ...
  - type: input
    id: link
    attributes:
      label: Screen link
      description: The share link with the videos you had open. Filled in automatically when you report from the site.
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: Filled in automatically when you report from the site.
