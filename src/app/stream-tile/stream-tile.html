@let source = stream().source;
@switch (source.platform) {
  @case ('youtube') {
    <app-youtube-embed [id]="source.id" [muted]="stream().muted" />
  }
  @case ('twitch') {
    <app-twitch-embed [id]="source.id" [muted]="stream().muted" />
  }
  @case ('kick') {
    <app-kick-embed [id]="source.id" [muted]="stream().muted" />
  }
  @case ('facebook') {
    <app-facebook-embed [id]="source.id" [muted]="stream().muted" />
  }
  @case ('x') {
    <app-x-embed [id]="source.id" />
  }
  @case ('xBroadcast') {
    <app-x-broadcast-embed [id]="source.id" />
  }
}

<span class="badge" [attr.data-platform]="source.platform">{{ platform().label }}</span>

<div class="controls" role="toolbar" [attr.aria-label]="t.tileControls">
  @if (canMove()) {
    <button
      type="button"
      class="grip"
      [title]="t.dragHint"
      [attr.aria-label]="t.dragLabel"
      (pointerdown)="dragStarted.emit($event)"
      (keydown)="nudge($event)"
    >
      <app-icon name="drag" />
    </button>
  }
  @if (platform().hasAudio) {
    <button
      type="button"
      (click)="muteToggled.emit()"
      [attr.aria-pressed]="!stream().muted"
      [title]="stream().muted ? t.unmute : t.mute"
    >
      <app-icon [name]="stream().muted ? 'volumeOff' : 'volumeOn'" />
    </button>
    <button type="button" (click)="soloed.emit()" [title]="t.solo">
      <app-icon name="headset" />
    </button>
  }
  @if (canPromote()) {
    <button type="button" (click)="promoted.emit()" [title]="t.promote">
      <app-icon name="star" />
    </button>
  }
  <a [href]="url()" target="_blank" rel="noopener" [title]="t.openIn(platform().label)">
    <app-icon name="openInNew" />
  </a>
  <button type="button" (click)="fullscreen()" [title]="t.fullscreen">
    <app-icon name="fullscreen" />
  </button>
  <button type="button" class="danger" (click)="removed.emit()" [title]="t.remove">
    <app-icon name="close" />
  </button>
</div>
